server {
  listen 80;

  location /api/ {
  proxy_set_header Host $http_host;
  proxy_pass http://backend:8000/api/;
  }

  location /swagger/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/swagger/;
  }

  location /admin/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/admin/;
  }

  location /static/ {
    alias /staticfiles/;
  }
}